<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שלומית בונה סוכה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg: #241a12; --fg: #f4ead3; --btn: #f4ead3; --btn-fg: #241a12; --accent: #e8612f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Rubik, "Arial Hebrew", sans-serif; }
  .page {
    min-height: 100vh; padding: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at center, #3a2a1c 0%, var(--bg) 70%);
  }
  .stage {
    width: min(100%, calc((100vh - 160px) * 16 / 9)); max-width: 100%;
    aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 8px #4a3726, 0 0 0 10px #1c140d;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font: 700 15px Rubik, sans-serif; padding: 10px 16px; border: none; border-radius: 999px;
    background: var(--btn); color: var(--btn-fg); cursor: pointer;
    box-shadow: 2px 3px 0 rgba(0,0,0,.4); display: inline-flex; align-items: center; gap: 6px;
  }
  .btn.accent { background: var(--accent); color: #fff; }
  .btn:focus-visible, .file:focus-within .btn { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn:active { transform: translate(1px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,.4); }
  .btn:disabled { opacity: .55; cursor: default; }
  .file { position: relative; }
  .file input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  #msg { margin: 0; min-height: 1.3em; font-size: 14px; opacity: .85; text-align: center; max-width: 60ch; }
  #msg a { color: var(--fg); }
</style>
</head>
<body>
<div class="page">
<div class="stage"><canvas id="c" aria-label="אנימציית סטופ-מושן מגזרי נייר: שלומית בונה סוכה"></canvas></div>
<div class="controls">
  <button class="btn" id="replay" type="button">↺ מההתחלה</button>
  <button class="btn" id="pause" type="button">⏸ השהה</button>
  <span class="file"><span class="btn accent">♪ הוספת השיר</span><input type="file" id="song" accept="audio/*" aria-label="בחירת קובץ השיר"></span>
  <button class="btn" id="rec" type="button">⬇ שמירה כווידאו</button>
</div>
<p id="msg" aria-live="polite">תצוגה מקדימה של 15 שניות. אפשר להוסיף קובץ שמע של השיר מהמכשיר.</p>
</div>

<script>
// ============================================================
//  שלומית בונה סוכה — סטופ-מושן מגזרי נייר
//  6 פריימים לשנייה. כל פיסה היא "גזיר" עם מרקם נייר, שוליים
//  גזורים/קרועים וצל, והיא זזה טיפה בכל פריים כמו בצילום אמיתי.
// ============================================================
const W = 1280, H = 720, FPS = 8;       // 8 פריימים לשנייה: סטופ-מושן
const PREVIEW = 15;                     // תצוגה מקדימה: 15 השניות הראשונות
const SCENE_SHIFT = -1.6;               // הסצנה מתחילה מוקדם יותר (הכותרת מהירה יותר)
const SCALE = 1;
const LOOPF = PREVIEW * FPS;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;

// ---------- כלים ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = mulberry32(1405);
const rnd = (a, b) => a + R() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// גזירה במספריים: קטעים ישרים באורך step עם סטייה קטנה
function rough(pts, amp = 1.4, step = 16) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const n = Math.max(1, Math.round(len / step)), nx = -dy / len, ny = dx / len;
    for (let k = 0; k < n; k++) {
      const f = k / n, o = k === 0 ? rnd(-amp, amp) * 0.5 : rnd(-amp, amp);
      out.push([x1 + dx * f + nx * o, y1 + dy * f + ny * o]);
    }
  }
  return out;
}
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function ell(cx, cy, rx, ry = rx, rot = 0, n) {
  n = n || Math.max(10, Math.round((rx + ry) * 0.45));
  const c = Math.cos(rot), s = Math.sin(rot), pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + rnd(-0.08, 0.08), x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    pts.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return pts;
}
function bboxOf(polys) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of polys) for (const [x, y] of p) {
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
// פיסת נייר בצבע אחד. torn = שוליים קרועים עם ליבה לבנה
function P(polys, color, o = {}) {
  if (typeof polys[0][0] === 'number') polys = [polys];
  const res = {
    polys: polys.map(p => o.raw ? p : rough(p, o.amp ?? 1.4, o.step ?? 16)),
    color, detail: !!o.detail, rule: o.rule || 'nonzero', edge: o.edge !== false,
  };
  if (o.torn) { res.fringe = polys.map(p => rough(p, o.torn, 5)); res.fringeColor = o.fringeColor || '#fbf5e6'; }
  return res;
}
function tr(g, polys) {
  g.beginPath();
  for (const poly of polys) {
    g.moveTo(poly[0][0], poly[0][1]);
    for (let i = 1; i < poly.length; i++) g.lineTo(poly[i][0], poly[i][1]);
    g.closePath();
  }
}
let shK = DPR;                          // גודל הצל תלוי בזום הנוכחי
function sh(g, b, x, y, c, k = shK) { g.shadowBlur = b * k; g.shadowOffsetX = x * k; g.shadowOffsetY = y * k; g.shadowColor = c; }

// ---------- מרקם נייר (כתמים, סיבים, גרעין) ----------
const TEX = (() => {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), r = mulberry32(77);
  for (let i = 0; i < 160; i++) {
    const x = r() * S, y = r() * S, rad = 6 + r() * 26;
    g.fillStyle = `rgba(70,45,20,${(0.006 + r() * 0.016).toFixed(3)})`;
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { g.beginPath(); g.arc(x + ox, y + oy, rad, 0, 7); g.fill(); }
  }
  for (let i = 0; i < 170; i++) {
    const x = r() * S, y = r() * S, a = r() * Math.PI, l = 4 + r() * 14;
    g.strokeStyle = r() < .55 ? `rgba(255,255,255,${(.25 + r() * .3).toFixed(2)})` : `rgba(50,30,10,${(.06 + r() * .08).toFixed(2)})`;
    g.lineWidth = .5 + r() * .7;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * l / 2 + (r() - .5) * 4, y + Math.sin(a) * l / 2 + (r() - .5) * 4, x + Math.cos(a) * l, y + Math.sin(a) * l);
    g.stroke();
  }
  const img = g.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const an = r() * 20 / 255, a0 = d[i + 3] / 255, a = an + a0 * (1 - an);
    if (a > 0) for (let j = 0; j < 3; j++) d[i + j] = d[i + j] * a0 * (1 - an) / a;
    d[i + 3] = a * 255;
  }
  g.putImageData(img, 0, 0);
  return c;
})();

// ---------- ספרייט = גזיר מוכן (נצבע פעם אחת, מוזז בכל פריים) ----------
function sprite(paths, o = {}) {
  const pad = o.pad ?? 10;
  const bb = o.bb || bboxOf(paths.flatMap(p => p.fringe ? p.fringe.concat(p.polys) : p.polys));
  const w = Math.ceil(bb.w + pad * 2), h = Math.ceil(bb.h + pad * 2);
  // רזולוציה גבוהה, כדי שהגזירים יישארו חדים גם כשהמצלמה מתקרבת
  const SS = w * h > 250000 ? DPR * 1.2 : w * h > 60000 ? DPR * 1.5 : DPR * 2.2, prevK = shK; shK = SS;
  const c = document.createElement('canvas'); c.width = Math.ceil(w * SS); c.height = Math.ceil(h * SS);
  const g = c.getContext('2d');
  g.scale(SS, SS); g.translate(pad - bb.x, pad - bb.y);
  for (const p of paths) {
    if (p.fringe) { tr(g, p.fringe); g.fillStyle = p.fringeColor; g.fill(); }
    if (p.detail) sh(g, 3, 1.2, 1.8, 'rgba(40,24,10,.4)');
    tr(g, p.polys); g.fillStyle = p.color; g.fill(p.rule);
    sh(g, 0, 0, 0, 'rgba(0,0,0,0)');
    if (p.edge) { g.lineWidth = .9; g.strokeStyle = 'rgba(255,255,255,.32)'; g.stroke(); }
  }
  if (o.after) o.after(g);
  g.globalCompositeOperation = 'source-atop';
  g.save(); g.translate(-Math.floor(R() * 256), -Math.floor(R() * 256));
  g.fillStyle = g.createPattern(TEX, 'repeat'); g.fillRect(bb.x - pad, bb.y - pad, w + 512, h + 512);
  g.restore();
  shK = prevK;
  return { c, x: bb.x - pad, y: bb.y - pad, w, h, pad };
}
function place(spr, x, y, rot = 0, depth = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  if (depth > 0) sh(ctx, 8 * depth, 3.5 * depth, 5 * depth, 'rgba(38,22,8,.42)');
  ctx.drawImage(spr.c, spr.x, spr.y, spr.w, spr.h);
  ctx.restore();
}

// ---------- ציר זמן ----------
const appearF = at => Math.round(at * SCALE * FPS);
const S = [];
function add(o) {
  o.id = S.length;
  if (o.jit === undefined) o.jit = 1;
  if (o.depth === undefined) o.depth = 1;
  if (o.rot0 === undefined) o.rot0 = rnd(-0.008, 0.008);     // אף פיסה לא מודבקת ישר לגמרי
  if (o.k === undefined) o.k = 1;                              // שכבת עומק: 0 = רחוק, 1 = הבמה, >1 = קדמה
  if (!o.group && !o.noShift) { o.at = (o.at || 0) + SCENE_SHIFT; if (o.until !== undefined) o.until += SCENE_SHIFT; }
  S.push(o); return o;
}
// פיסה עם קואורדינטות עולם: הציר הוא (px,py)
function piece(paths, o) {
  const spr = sprite(paths, o);
  const bb = bboxOf(paths.flatMap(p => p.polys));
  return add(Object.assign({ spr, px: bb.x + bb.w / 2, py: bb.y + bb.h / 2, anim: 'none', at: 0 }, o, { bbw: bb }));
}
// הנפשות קצרות, פריים-פריים. n = כמה פריימים לוקחת הכניסה
const DEFN = { none: 0, pop: 3, drop: 4, slide: 4, roll: 8, tumble: 6, flip: 5, rise: 3, unroll: 5, unrollX: 6 };
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOutBack = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
function animState(p, k) {
  const n = p.n ?? DEFN[p.anim] ?? 0, st = { dx: 0, dy: 0, rot: 0, sc: 1, sx: 1, reveal: 1, clipY: null, revealX: 1 };
  if (k >= n) return st;
  const l = (k + 1) / n, from = p.from || [0, 0];
  switch (p.anim) {
    case 'pop': st.sc = [.45, 1.15, .95][k] ?? 1; break;
    case 'drop': { const e = easeOutBack(l, 1.6); st.dy = -(1 - e) * (p.dist ?? 160); st.rot = (1 - e) * (p.spin ?? .25); break; }
    case 'slide': { const e = easeOutBack(l, 1.3); st.dx = (1 - e) * from[0]; st.dy = (1 - e) * from[1]; break; }
    case 'roll': { const e = easeOut(l); st.dx = (1 - e) * from[0]; st.dy = (1 - e) * from[1]; st.rot = -st.dx / (p.radius || 60); break; }
    case 'tumble': { const e = easeOutBack(l, 1.2); st.dx = (1 - e) * from[0]; st.dy = (1 - e) * from[1]; st.rot = (1 - e) * (p.turns ?? 1) * Math.PI * 2; break; }
    case 'flip': st.sx = Math.cos(Math.PI * (1 - l)); st.dy = -(1 - l) * 24; break;
    case 'rise': st.dy = [.75, .3, -.03][k] * p.bbw.h; st.clipY = p.base; break;
    case 'unroll': st.reveal = [.2, .4, .6, .8, .94][k]; break;
    case 'unrollX': st.revealX = (k + 1) / n * .96; break;
  }
  return st;
}
function drawPiece(p, cf, bf) {
  const af = appearF(p.at);
  if (cf < af) return;
  let ex = null;
  if (p.until !== undefined) {
    const k2 = cf - appearF(p.until);
    if (k2 >= 0) {
      if (p.exit !== 'fall' || k2 >= 5) return;
      ex = { dx: -(k2 + 1) * 16, dy: (k2 + 1) * (k2 + 1) * 16, rot: -(k2 + 1) * .32 };   // נופל ומתגלגל החוצה
    }
  }
  if (p.draw) { p.draw(cf, bf); return; }
  const st = animState(p, cf - af);
  let dx = st.dx, dy = st.dy, rot = p.rot0 + st.rot * (p.spinDir || 1);
  if (ex) { dx += ex.dx; dy += ex.dy; rot += ex.rot; }
  const jr = mulberry32(bf * 7919 + p.id * 104729 + 1), J = p.jit;
  dx += (jr() - .5) * 2.2 * J; dy += (jr() - .5) * 2.2 * J; rot += (jr() - .5) * .012 * J;
  if (p.swing) rot += 0.05 * Math.sin(bf * 0.7 + p.id);

  const s = p.spr;
  ctx.save();
  if (p.shift) ctx.translate(p.shift, 0);
  if (st.clipY !== null) { ctx.beginPath(); ctx.rect(-200, -1000, W + 400, st.clipY + 1000); ctx.clip(); }
  if (st.reveal < 1) { ctx.beginPath(); ctx.rect(s.x - 20, s.y, s.w + 40, s.pad + (s.h - 2 * s.pad) * st.reveal); ctx.clip(); }
  const rxEdge = s.x + s.w - s.pad - (s.w - 2 * s.pad) * st.revealX;               // נפרש מימין לשמאל
  if (st.revealX < 1) { ctx.beginPath(); ctx.rect(rxEdge, s.y - 20, s.x + s.w - rxEdge + 20, s.h + 40); ctx.clip(); }
  ctx.translate(p.px + dx, p.py + dy); ctx.rotate(rot); ctx.scale(st.sc * Math.abs(st.sx) || .02, st.sc);
  if (p.depth > 0) sh(ctx, 8 * p.depth, 3.5 * p.depth, 5 * p.depth, 'rgba(38,22,8,.42)');
  const img = st.sx < 0 && p.back ? p.back : s;                                       // צד אחורי של הנייר
  ctx.drawImage(img.c, img.x - p.px, img.y - p.py, img.w, img.h);
  ctx.restore();
  if (st.reveal < 1 && p.roll) {                                                       // גליל הבד
    ctx.save(); if (p.shift) ctx.translate(p.shift, 0);
    place(p.roll, s.x + s.w / 2 + dx, s.y + s.pad + (s.h - 2 * s.pad) * st.reveal + dy, 0);
    ctx.restore();
  }
  if (st.revealX < 1 && p.roll) place(p.roll, rxEdge, p.py + dy, 0);
}

// ============================================================
//  התפאורה
// ============================================================
const C = {
  sky: '#86c9dc', sky2: '#a9dbe6', sun: '#fcd03f', sunIn: '#fde68a', ray: '#f7a531', cloud: '#fbf6ea',
  hill1: '#a3cf88', hill2: '#7fb865', ground: '#5d9f47', tuft: '#4a8a3a', leaf: '#5a9a42',
  wood: '#a86b3c', woodL: '#c98a52', woodD: '#7a4826',
  wall: '#f3e7cc', wallS: '#e0cda4', blue: '#2f6db5', red: '#d9483b', gold: '#e9b02c',
};
const PAPER = ['#e3343f', '#f2b134', '#2f86d6', '#4caf50', '#ef7a36', '#8e55b8'];

piece([P(rect(-100, -60, W + 200, H + 120), C.sky, { raw: true, edge: false })], { depth: 0, jit: 0, rot0: 0, k: .15 });
{
  const pts = [];
  for (let x = -60; x <= 1340; x += 60) pts.push([x, 330 + 14 * Math.sin(x / 150)]);
  pts.push([1340, 780], [-60, 780]);
  piece([P(pts, C.sky2, { torn: 3 })], { depth: .3, jit: .3, rot0: 0, k: .3 });
}
{ // שמש עם פנים
  const SX = 1130, SY = 118, rays = [];
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    rays.push([[Math.cos(a - .16) * 56, Math.sin(a - .16) * 56], [Math.cos(a) * 100, Math.sin(a) * 100],
               [Math.cos(a + .16) * 56, Math.sin(a + .16) * 56]].map(([x, y]) => [x + SX, y + SY]));
  }
  const arc = (cx, cy, r, a0, a1, th) => { const o = []; for (let a = a0; a <= a1 + 1e-6; a += (a1 - a0) / 6) o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    for (let a = a1; a >= a0 - 1e-6; a -= (a1 - a0) / 6) o.push([cx + (r - th) * Math.cos(a), cy + (r - th) * Math.sin(a)]); return o; };
  piece([P(rays, C.ray, { amp: 1.2, step: 12 }), P(ell(SX, SY, 60), C.sun, { amp: 1 }), P(ell(SX, SY, 44), C.sunIn, { detail: true, amp: .8 }),
         P([arc(SX - 17, SY - 10, 9, .15 * Math.PI, .85 * Math.PI, 2.6), arc(SX + 17, SY - 10, 9, .15 * Math.PI, .85 * Math.PI, 2.6)], '#9a5a1c', { detail: true, amp: .2, step: 30 }),
         P(arc(SX, SY + 4, 18, .2 * Math.PI, .8 * Math.PI, 3.5), '#b9472a', { detail: true, amp: .2, step: 30 }),
         P([ell(SX - 30, SY + 10, 8, 5), ell(SX + 30, SY + 10, 8, 5)], '#f59a6a', { detail: true, amp: .4 })],
        { at: 5.5, anim: 'roll', from: [420, 0], radius: 100, px: SX, py: SY, k: .2 });   // השמש מתגלגלת פנימה
}
function cloud(cx, cy, k, at, from) {
  const bits = off => [[-60, 10, 32], [-22, -10, 42], [26, -4, 36], [62, 12, 26]].map(([x, y, r]) => ell(cx + x * k + off, cy + y * k + off, r * k))
    .concat([ell(cx + off, cy + 20 * k + off, 80 * k, 18 * k)]);
  piece([P(bits(7), '#dbe9ee', { amp: 1.2, step: 10 }), P(bits(0), C.cloud, { amp: 1.2, step: 10, torn: 2.5, fringeColor: '#ffffff' })],
        { at, anim: 'slide', from, depth: .7, k: .3 });
}
cloud(190, 180, 1, 5.8, [-420, 0]); cloud(1000, 275, .8, 6.0, [360, 0]); cloud(620, 120, .55, 6.2, [0, -200]);
const hill1Y = x => 478 + 26 * Math.sin(x / 190 + 0.4) + 10 * Math.sin(x / 60);
{
  const pts = [];
  for (let x = -60; x <= 1340; x += 40) pts.push([x, hill1Y(x)]);
  pts.push([1340, 780], [-60, 780]);
  // שדות מעובדים: פסים של נייר בגוונים
  const fields = [];
  for (let i = 0; i < 5; i++) { const x0 = 40 + i * 260 + rnd(-30, 30); fields.push([[x0, hill1Y(x0) + 22], [x0 + 150, hill1Y(x0 + 150) + 22], [x0 + 170, hill1Y(x0 + 170) + 48], [x0 + 20, hill1Y(x0 + 20) + 48]]); }
  piece([P(pts, C.hill1, { torn: 3.5 }), P(fields, '#b8d98c', { detail: true, amp: 1 })], { depth: .6, jit: .5, rot0: 0, k: .5 });
}
// כפר רחוק: בתים עם גגות אדומים, מגדל מים וברושים

const msg = document.getElementById('msg'), btnPause = document.getElementById('pause'), btnRec = document.getElementById('rec');
const audio = new Audio(); audio.preload = 'auto';
let audioReady = false, t0 = performance.now(), paused = false, pauseAt = 0, lastBF = -1, recorder = null, recStartBF = 0;
let ac = null, audioDest = null;

function contentFrame(bf) {
  if (audioReady) {
    if (audio.currentTime >= PREVIEW && !audio.paused) audio.pause();           // התצוגה המקדימה נגמרת כאן
    return Math.min(Math.floor(audio.currentTime * FPS), LOOPF - 1);
  }
  return bf % LOOPF;
}
function tick() {
  if (!paused) {
    const bf = Math.floor((performance.now() - t0) / 1000 * FPS);
    if (bf !== lastBF) {
      lastBF = bf; render(contentFrame(bf), bf);
      if (recorder && bf >= LOOPF + 4) recorder.stop();
    }
  }
  requestAnimationFrame(tick);
}
function replay() {
  t0 = performance.now(); lastBF = -1; paused = false; btnPause.textContent = '⏸ השהה';
  if (audioReady) { audio.currentTime = 0; audio.play().catch(() => { msg.textContent = 'לחצו על "מההתחלה" כדי להפעיל את השיר.'; }); }
}
document.getElementById('replay').onclick = replay;
btnPause.onclick = () => {
  if (paused) {
    t0 += performance.now() - pauseAt; paused = false; btnPause.textContent = '⏸ השהה';
    if (audioReady && !audio.ended) audio.play().catch(() => {});
  } else {
    pauseAt = performance.now(); paused = true; btnPause.textContent = '▶ המשך';
    if (audioReady) audio.pause();
  }
};
const fmt = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
document.getElementById('song').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  audio.src = URL.createObjectURL(file);
  try {
    await new Promise((res, rej) => { audio.onloadedmetadata = res; audio.onerror = rej; });
  } catch { msg.textContent = 'לא הצלחתי לקרוא את הקובץ. נסו קובץ MP3 או M4A.'; return; }
  audioReady = true;
  msg.textContent = `השיר נטען (${fmt(audio.duration)}). בתצוגה המקדימה מתנגנות ${PREVIEW} השניות הראשונות.`;
  replay();
};
audio.onended = () => { if (recorder) setTimeout(() => recorder && recorder.stop(), 700); };

async function saveFile(blob, name) {
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); msg.textContent = 'הווידאו נשמר.'; }
    catch (err) { msg.textContent = err && err.code === 'declined' ? '' : 'השמירה לא הצליחה. נסו שוב.'; }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.textContent = 'הווידאו מוכן, לחצו כאן לשמירה';
  msg.textContent = ''; msg.appendChild(a);
  try { a.click(); } catch {}
}
btnRec.onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  const type = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']
    .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type || !cv.captureStream) { msg.textContent = 'הדפדפן הזה לא תומך בהקלטת וידאו. נסו בכרום.'; return; }
  const tracks = [...cv.captureStream(30).getVideoTracks()];
  if (audioReady) {
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const src = ac.createMediaElementSource(audio);
        audioDest = ac.createMediaStreamDestination();
        src.connect(ac.destination); src.connect(audioDest);
      }
      await ac.resume();
      tracks.push(...audioDest.stream.getAudioTracks());
    } catch { msg.textContent = 'לא הצלחתי לחבר את השיר להקלטה, מקליט בלי קול.'; }
  }
  const chunks = [];
  try { recorder = new MediaRecorder(new MediaStream(tracks), { mimeType: type, videoBitsPerSecond: 5e6 }); }
  catch (err) { msg.textContent = 'לא הצלחתי להתחיל הקלטה: ' + err.message; recorder = null; return; }
  recorder.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
  recorder.onstop = () => {
    recorder = null; btnRec.textContent = '⬇ שמירה כווידאו';
    saveFile(new Blob(chunks, { type }), 'shlomit-sukkah.' + (type.startsWith('video/mp4') ? 'mp4' : 'webm'));
  };
  replay();
  recorder.start(1000);
  btnRec.textContent = '■ עצירת ההקלטה';
  msg.textContent = audioReady ? 'מקליט עם השיר… ההקלטה תיעצר לבד בסוף השיר.' : 'מקליט… ההקלטה תיעצר לבד בסוף.';
};

// מחכים לגופן ואז מתחילים (?frame=N מצייר פריים אחד, בשביל רינדור וידאו)
Promise.race([document.fonts.load('84px "Secular One"').catch(() => {}), new Promise(r => setTimeout(r, 1500))]).then(() => {
  buildTexts();
  const fz = new URLSearchParams(location.search).get('frame');
  if (fz !== null) { render(+fz % LOOPF, +fz); window.__ready = true; return; }
  t0 = performance.now();
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
